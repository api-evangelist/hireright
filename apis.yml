aid: hireright
name: HireRight
description: >-
  HireRight is a leading global provider of employment background screening,
  drug and health screening, and workforce verification services, helping more
  than 28,000 organizations across 200+ countries and territories run and manage
  their screening programs. Founded in 1990 and headquartered in Nashville,
  Tennessee, HireRight offers 250+ products and services spanning criminal,
  financial, identity, education and employment verification, compliance,
  driving records, and Form I-9 checks, and screened roughly 85 million people
  in 2025. HireRight does not publish a public developer REST API or developer
  portal; its integration surface is partner- and contract-based, delivered
  through 70+ prebuilt connectors with 45+ HCM and ATS partners (including
  Workday, ADP, Oracle, and UKG) and the Applicant Center candidate experience.
  This API Evangelist profile captures the company's public, machine-readable,
  and security/compliance surface (llms.txt, trust center, disclosure, domain
  security) rather than an open API.
